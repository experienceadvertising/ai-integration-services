<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#D4703A" />

    <!-- Per-route SEO (Helmet) is injected here at build time / on hydration.
         Crawlers that take the first occurrence of a tag will pick the
         route-specific Helmet output above the static fallback below. -->
    <!--ssr-helmet-->

    <!-- Static fallback SEO — used only when Helmet doesn't render
         (e.g. unknown routes served via SPA fallback). -->
    <title>Claude Cowork Training for Teams | Evan Weber AI Trainer</title>
    <meta name="description" content="Live Claude Cowork training for business teams by Evan Weber — 25-year digital marketing veteran and daily AI power user. Book a 1-hour or 4-hour session. Stripe checkout." />
    <meta name="author" content="Evan Weber" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI Training by Evan Weber" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Claude Cowork Training for Teams | Evan Weber" />
    <meta property="og:description" content="Live Claude Cowork training for business teams. 25-year digital marketing veteran. Book a session today — see results on day one." />
    <meta property="og:url" content="https://learncowork.net/" />
    <meta property="og:image" content="https://learncowork.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Claude Cowork Training by Evan Weber — learncowork.net" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@evanweber" />
    <meta name="twitter:title" content="Claude Cowork Training for Teams | Evan Weber" />
    <meta name="twitter:description" content="Live Claude Cowork training for business teams. 25-year digital marketing veteran. Book a session today." />
    <meta name="twitter:image" content="https://learncowork.net/og-image.png" />

    <!-- Async font loading (non-render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>

    <!-- Structured Data: Person + Service -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "https://learncowork.net/#evan",
          "name": "Evan Weber",
          "jobTitle": "AI Productivity Trainer & Digital Marketing Consultant",
          "description": "25-year digital marketing veteran, founder of Experience Advertising, and daily Claude Cowork and Claude Code user. Trains business teams to use AI tools fluently.",
          "url": "https://learncowork.net",
          "image": "https://learncowork.net/og-evan.jpg",
          "sameAs": [
            "https://www.linkedin.com/in/worldsgreatestmarketer/",
            "https://experienceadvertising.com"
          ],
          "worksFor": {
            "@type": "Organization",
            "name": "Experience Advertising",
            "url": "https://experienceadvertising.com"
          },
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Fort Lauderdale",
            "addressRegion": "FL",
            "addressCountry": "US"
          }
        },
        {
          "@type": "Service",
          "@id": "https://learncowork.net/#service",
          "name": "Claude Cowork & AI Training for Business Teams",
          "description": "Live 1-on-1 training sessions with Evan Weber covering Claude Cowork, Claude Code, Replit, and AI productivity tools for every department.",
          "provider": { "@id": "https://learncowork.net/#evan" },
          "areaServed": "Worldwide",
          "availableChannel": {
            "@type": "ServiceChannel",
            "serviceType": "Online"
          },
          "offers": [
            {
              "@type": "Offer",
              "name": "1-Hour Training Session",
              "price": "300",
              "priceCurrency": "USD",
              "description": "Focused 1-hour live session via screen share tailored to your team's workflows."
            },
            {
              "@type": "Offer",
              "name": "4-Hour Deep Dive Workshop",
              "price": "1000",
              "priceCurrency": "USD",
              "description": "Comprehensive 4-hour workshop building real workflows together, department by department."
            }
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://learncowork.net/#website",
          "url": "https://learncowork.net",
          "name": "AI Training by Evan Weber",
          "description": "Claude Cowork and AI coding training for business teams.",
          "publisher": { "@id": "https://learncowork.net/#evan" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
