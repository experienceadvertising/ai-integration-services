kind = "web"
previewPath = "/"
title = "AI Consulting & Training"
version = "1.0.0"
id = "artifacts/consulting-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18707

[services.development]
run = "pnpm --filter @workspace/consulting-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/consulting-site", "run", "build" ]
publicDir = "artifacts/consulting-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18707"
BASE_PATH = "/"
